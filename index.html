<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車款持有成本 — 10 年試算</title>
<style>
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #e2dfd9;
    --accent: #1f5f4f;
    --dep: #1f5f4f;
    --maint: #c98a3c;
    --sell: #a8a29a;
    --shadow: 0 1px 2px rgba(28,27,25,.06), 0 8px 24px rgba(28,27,25,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --surface: #1f1f23; --ink: #ecebe8; --ink-soft: #9b9791;
      --line: #33333a; --accent: #6cc0a5; --dep: #6cc0a5; --maint: #e0a95f;
      --sell: #7d7a76;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 80px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Helvetica Neue", -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.01em; margin: 0 0 6px; font-weight: 600; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }
  h3 { font-size: 15px; font-weight: 600; margin: 34px 0 12px; }
  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 22px 0 4px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .controls label { font-size: 13px; color: var(--ink-soft); }
  select {
    font: inherit; font-size: 14px; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
  }
  .src { font-size: 12px; color: var(--ink-soft); margin-left: auto; }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .chart { overflow-x: auto; }
  svg { display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--ink-soft); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  td.num { font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  details { border-bottom: 1px solid var(--line); }
  details:last-child { border-bottom: 0; }
  summary {
    cursor: pointer; padding: 12px 2px; font-size: 14px;
    display: flex; align-items: baseline; gap: 10px; list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: var(--ink-soft); font-size: 11px; }
  details[open] summary::before { content: "▾"; }
  summary .nm { font-weight: 500; }
  summary .mo { margin-left: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .body { padding: 4px 0 24px 20px; }
  .figs { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .fig { flex: 1 1 130px; }
  .fig .k { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .fig .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .fig .u { font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  .sec { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .split { display: grid; grid-template-columns: 1fr; gap: 26px; }
  @media (min-width: 760px) { .split { grid-template-columns: 1fr 1fr; } }
  .note { font-size: 12.5px; color: var(--ink-soft); margin-top: 16px; }
  .badge {
    font-size: 11px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--ink-soft);
  }
  .err { font-size: 14px; color: var(--ink-soft); }
  .err code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>車款持有成本 — 10 年試算</h1>
  <p class="sub">成本 = 折舊 + 保養 + 賣出費用。稅金與保險不計（與車種、廠牌幾乎無關）。</p>

  <div class="controls">
    <label for="km">年行駛里程</label>
    <select id="km">
      <option value="6000">6,000 km</option>
      <option value="7000" selected>7,000 km</option>
      <option value="8000">8,000 km</option>
    </select>
    <label for="sort" style="margin-left:8px">排序</label>
    <select id="sort">
      <option value="monthly">每月成本</option>
      <option value="total">10 年總成本</option>
      <option value="retention">10 年殘值率</option>
      <option value="price">車價</option>
    </select>
    <span class="src" id="src"></span>
  </div>

  <div id="out"></div>
</div>

<script>
const SOURCES = ["data/vehicles.json", "examples/vehicles.example.json"];
const nf = n => Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function load() {
  for (const url of SOURCES) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) continue;
      const d = await r.json();
      if (Array.isArray(d) && d.length) return { data: d, from: url };
    } catch (e) { /* file:// blocks fetch — fall through to the hint below */ }
  }
  return { data: [], from: null };
}

// Pull the numbers for one holding period out of a vehicle document.
function costAt(v, years) {
  const vc = v.value_checkpoints.find(c => c.years === years);
  const mc = v.maintenance.checkpoints.find(c => c.years === years);
  if (!vc) return null;
  const real = v.purchase.real_cost;
  const dep = vc.depreciation_amount != null ? vc.depreciation_amount : real - vc.private_sale_price;
  const maint = mc && mc.cumulative_cost != null ? mc.cumulative_cost : 0;
  const sell = (v.selling_costs && v.selling_costs.total) || 0;
  return {
    years, dep, maint, sell,
    total: dep + maint + sell,
    monthly: (dep + maint + sell) / (years * 12),
    resale: vc.private_sale_price,
    retention: vc.private_sale_price / real,
  };
}

const name = v => [v.brand, v.model].join(" ");
const full = v => [v.brand, v.model, v.trim].filter(Boolean).join(" ");

/* ---------- overview: every car on one axis ---------- */
function rankedChart(rows) {
  const W = 940, RH = 26, L = 178, R = 96, T = 26;
  const H = T + rows.length * RH + 6;
  const max = Math.max(...rows.map(r => r.c.total)) * 1.02;
  const scale = (W - L - R) / max;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const val = (max / 4) * i, x = L + val * scale;
    g += `<line x1="${x}" y1="${T - 8}" x2="${x}" y2="${H - 4}" stroke="var(--line)"/>
          <text x="${x}" y="${T - 13}" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${nf(val / 10000)}萬</text>`;
  }
  rows.forEach((r, i) => {
    const y = T + i * RH, h = RH - 9;
    let x = L;
    for (const [val, fill] of [[r.c.dep, "var(--dep)"], [r.c.maint, "var(--maint)"], [r.c.sell, "var(--sell)"]]) {
      const w = val * scale;
      g += `<rect x="${x}" y="${y}" width="${Math.max(w, 0)}" height="${h}" fill="${fill}"><title>${esc(full(r.v))}
折舊 ${nf(r.c.dep)} ／ 保養 ${nf(r.c.maint)} ／ 賣出 ${nf(r.c.sell)}</title></rect>`;
      x += w;
    }
    g += `<text x="${L - 10}" y="${y + h - 2}" text-anchor="end" font-size="12" fill="var(--ink)">${esc(name(r.v))}</text>
          <text x="${x + 8}" y="${y + h - 2}" font-size="12" fill="var(--ink-soft)">${nf(r.c.monthly)}/月</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="各車款 10 年總成本">${g}</svg></div>
  <div class="legend"><span><i style="background:var(--dep)"></i>折舊</span><span><i style="background:var(--maint)"></i>保養</span><span><i style="background:var(--sell)"></i>賣出費用</span><span>右側數字為每月平均成本</span></div>`;
}

function overviewTable(rows, annualKm) {
  const km = annualKm * 10;
  const tr = rows.map(r => `<tr>
    <td>${esc(full(r.v))} <span class="badge">${esc(r.v.powertrain)}</span></td>
    <td class="num">${nf(r.v.purchase.real_cost)}</td>
    <td class="num">${nf(r.c.resale)}</td>
    <td class="num">${(r.c.retention * 100).toFixed(0)}%</td>
    <td class="num">${nf(r.c.maint)}</td>
    <td class="num">${nf(r.c.total)}</td>
    <td class="num"><b>${nf(r.c.monthly)}</b></td>
    <td class="num">${(r.c.total / km).toFixed(1)}</td>
  </tr>`).join("");
  return `<table><thead><tr>
    <th>車款</th><th>實付車價</th><th>10 年殘值</th><th>殘值率</th>
    <th>10 年保養</th><th>10 年總成本</th><th>每月平均</th><th>元/km</th>
  </tr></thead><tbody>${tr}</tbody></table>`;
}

/* ---------- per-vehicle detail ---------- */
function stackedBar(c) {
  const W = 440, H = 40;
  const seg = [["折舊", c.dep, "var(--dep)"], ["保養", c.maint, "var(--maint)"], ["賣出", c.sell, "var(--sell)"]];
  let x = 0, parts = "";
  for (const [n, val, fill] of seg) {
    const w = (val / c.total) * W - 1, pct = (val / c.total) * 100;
    parts += `<rect x="${x}" y="0" width="${Math.max(w, 0)}" height="${H}" fill="${fill}" rx="3"><title>${n} NT$${nf(val)}（${pct.toFixed(1)}%）</title></rect>`;
    if (w > 64) parts += `<text x="${x + 9}" y="${H / 2 + 5}" fill="#fff" font-size="12" font-weight="500">${n} ${pct.toFixed(0)}%</text>`;
    x += w + 1;
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${parts}</svg></div>
  <div class="legend"><span><i style="background:var(--dep)"></i>折舊 ${nf(c.dep)}</span><span><i style="background:var(--maint)"></i>保養 ${nf(c.maint)}</span><span><i style="background:var(--sell)"></i>賣出 ${nf(c.sell)}</span></div>`;
}

// Monthly cost by holding period — shows the early depreciation hit spreading out.
function monthlyBars(v) {
  const pts = v.value_checkpoints.map(c => costAt(v, c.years)).filter(Boolean);
  if (!pts.length) return "";
  const W = 440, H = 190, L = 52, B = 28, T = 18;
  const max = Math.max(...pts.map(p => p.monthly)) * 1.14;
  const bw = (W - L - 8) / pts.length;
  let g = "";
  for (let i = 0; i <= 3; i++) {
    const val = (max / 3) * i, y = T + (H - T - B) * (1 - val / max);
    g += `<line x1="${L}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)"/>
          <text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--ink-soft)">${nf(val / 1000)}k</text>`;
  }
  pts.forEach((p, i) => {
    const h = (H - T - B) * (p.monthly / max), x = L + i * bw + bw * 0.2, y = H - B - h, w = bw * 0.6;
    g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--accent)" rx="3" opacity="${p.years === 10 ? 1 : .4}"><title>持有 ${p.years} 年：每月 NT$${nf(p.monthly)}</title></rect>
          <text x="${x + w / 2}" y="${y - 5}" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${nf(p.monthly / 1000)}k</text>
          <text x="${x + w / 2}" y="${H - 9}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${p.years}年</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}</svg></div>`;
}

function detail(v, c, annualKm) {
  const km = annualKm * 10, c1 = costAt(v, 1);
  const conf = v.value_checkpoints.map(x => x.confidence);
  const worst = conf.includes("low") ? "low" : conf.includes("medium") ? "medium" : "high";
  return `<details><summary>
      <span class="nm">${esc(full(v))}</span>
      <span class="badge">${esc(v.powertrain)}</span>
      <span class="mo">每月 ${nf(c.monthly)}　/　10 年 ${nf(c.total)}</span>
    </summary>
    <div class="body">
      <div class="figs">
        <div class="fig"><div class="k">實付車價</div><div class="v">${nf(v.purchase.real_cost)}</div></div>
        <div class="fig"><div class="k">10 年後殘值</div><div class="v">${nf(c.resale)}<span class="u"> ・ ${(c.retention * 100).toFixed(0)}%</span></div></div>
        <div class="fig"><div class="k">10 年總成本</div><div class="v">${nf(c.total)}</div></div>
        <div class="fig"><div class="k">每月平均</div><div class="v">${nf(c.monthly)}</div></div>
        <div class="fig"><div class="k">每公里</div><div class="v">${(c.total / km).toFixed(1)}<span class="u"> 元</span></div></div>
      </div>
      <div class="split">
        <div><p class="sec">10 年成本組成</p>${stackedBar(c)}</div>
        <div><p class="sec">每月平均成本 × 持有年限</p>${monthlyBars(v)}</div>
      </div>
      <p class="note">折舊佔 ${((c.dep / c.total) * 100).toFixed(0)}%、保養佔 ${((c.maint / c.total) * 100).toFixed(0)}%。
        第 1 年每月 ${nf(c1.monthly)}，第 10 年降到 ${nf(c.monthly)}。<br>
        保養：${esc(v.maintenance.plan_notes || "—")}<br>
        估價可信度：<b>${worst}</b>　・　資料更新：${esc(v.updated_at)}</p>
    </div>
  </details>`;
}

let DATA = [];
function render() {
  const annualKm = +document.getElementById("km").value;
  const sortBy = document.getElementById("sort").value;
  const out = document.getElementById("out");

  if (!DATA.length) {
    out.innerHTML = `<div class="panel"><p class="err">讀不到資料。瀏覽器會擋住 <code>file://</code> 讀檔，請用本機 server 開：<br><br>
      <code>cd vehicle-table &amp;&amp; python3 -m http.server 8791</code><br><br>
      然後開 <code>http://127.0.0.1:8791/index.html</code></p></div>`;
    return;
  }

  const rows = DATA.map(v => ({ v, c: costAt(v, 10) })).filter(r => r.c);
  const key = {
    monthly: r => r.c.monthly,
    total: r => r.c.total,
    retention: r => -r.c.retention,
    price: r => r.v.purchase.real_cost,
  }[sortBy];
  rows.sort((a, b) => key(a) - key(b));

  out.innerHTML = `
    <div class="panel">
      <h3 style="margin-top:0">10 年總成本（持有 10 年、累積 ${nf(annualKm * 10)} km）</h3>
      ${rankedChart(rows)}
    </div>
    <div class="panel"><h3 style="margin-top:0">明細</h3><div class="chart">${overviewTable(rows, annualKm)}</div></div>
    <div class="panel"><h3 style="margin-top:0">各車款細節</h3>${rows.map(r => detail(r.v, r.c, annualKm)).join("")}</div>`;
}

load().then(({ data, from }) => {
  DATA = data;
  document.getElementById("src").textContent = from ? "資料來源：" + from : "";
  document.getElementById("km").addEventListener("change", render);
  document.getElementById("sort").addEventListener("change", render);
  render();
});
</script>
</body>
</html>
