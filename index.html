<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車款持有成本 — 10 年試算</title>
<style>
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #e2dfd9;
    --accent: #1f5f4f;
    --dep: #1f5f4f;
    --maint: #c98a3c;
    --sell: #8a8580;
    --shadow: 0 1px 2px rgba(28,27,25,.06), 0 8px 24px rgba(28,27,25,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --surface: #1f1f23; --ink: #ecebe8; --ink-soft: #9b9791;
      --line: #33333a; --accent: #6cc0a5; --dep: #6cc0a5; --maint: #e0a95f;
      --sell: #7d7a76;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 72px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Helvetica Neue", -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 28px; letter-spacing: -.01em; margin: 0 0 6px; font-weight: 600; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 22px 0 28px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .controls label { font-size: 13px; color: var(--ink-soft); }
  select {
    font: inherit; font-size: 14px; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
  }
  .src { font-size: 12px; color: var(--ink-soft); margin-left: auto; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 19px; margin: 0 0 2px; font-weight: 600; }
  .meta { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }
  .badge {
    display: inline-block; font-size: 11px; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line);
    color: var(--ink-soft); margin-left: 6px; vertical-align: 2px;
  }
  .figs { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  .fig { flex: 1 1 150px; }
  .fig .k { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .fig .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .fig .v.small { font-size: 20px; }
  .fig .u { font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  .sec { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; letter-spacing: .02em; }
  .chart { overflow-x: auto; }
  svg { display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .split { display: grid; grid-template-columns: 1fr; gap: 26px; }
  @media (min-width: 720px) { .split { grid-template-columns: 1fr 1fr; } }
  .note { font-size: 12px; color: var(--ink-soft); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .empty { color: var(--ink-soft); font-size: 14px; }
  text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>車款持有成本 — 10 年試算</h1>
    <p class="sub">成本 = 折舊 + 保養 + 賣出費用。稅金與保險不計（與車種、廠牌幾乎無關）。</p>
  </header>

  <div class="controls">
    <label for="km">年行駛里程</label>
    <select id="km">
      <option value="6000">6,000 km</option>
      <option value="7000" selected>7,000 km</option>
      <option value="8000">8,000 km</option>
    </select>
    <span class="src" id="src"></span>
  </div>

  <div id="out"></div>
</div>

<script>
// file:// blocks fetch, so keep a copy of the example here as a last resort.
// Regenerate by hand if examples/vehicles.example.json changes.
const FALLBACK = [{"id":"toyota-corolla-cross-2024-hybrid","brand":"Toyota","model":"Corolla Cross","trim":"旗艦","model_year":2024,"powertrain":"hybrid","currency":"TWD","assumptions":{"annual_km_low":6000,"annual_km_high":8000},"purchase":{"list_price":969000,"real_cost":954000},"selling_costs":{"total":4500},"value_checkpoints":[{"years":1,"private_sale_price":800000,"depreciation_amount":154000,"retention_ratio":0.839},{"years":3,"private_sale_price":690000,"depreciation_amount":264000,"retention_ratio":0.723},{"years":5,"private_sale_price":580000,"depreciation_amount":374000,"retention_ratio":0.608},{"years":7,"private_sale_price":480000,"depreciation_amount":474000,"retention_ratio":0.503},{"years":10,"private_sale_price":350000,"depreciation_amount":604000,"retention_ratio":0.367}],"maintenance":{"checkpoints":[{"years":1,"period_cost":3500,"cumulative_cost":3500},{"years":3,"period_cost":12000,"cumulative_cost":15500},{"years":5,"period_cost":18000,"cumulative_cost":33500},{"years":7,"period_cost":25000,"cumulative_cost":58500},{"years":10,"period_cost":45000,"cumulative_cost":103500}]},"updated_at":"2026-08-11"}];

const SOURCES = ["data/vehicles.json", "examples/vehicles.example.json"];
const nf = n => Math.round(n).toLocaleString("en-US");
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

async function load() {
  for (const url of SOURCES) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) continue;
      const d = await r.json();
      if (Array.isArray(d) && d.length) return { data: d, from: url };
    } catch (e) { /* file:// or missing file — try the next one */ }
  }
  return { data: FALLBACK, from: "內建範例（無法讀取檔案，可能是用 file:// 開啟）" };
}

// Pull the numbers for a given holding period out of one vehicle document.
function costAt(v, years) {
  const vc = v.value_checkpoints.find(c => c.years === years);
  const mc = v.maintenance.checkpoints.find(c => c.years === years);
  if (!vc) return null;
  const real = v.purchase.real_cost;
  const dep = vc.depreciation_amount != null ? vc.depreciation_amount : real - vc.private_sale_price;
  const maint = mc ? (mc.cumulative_cost != null ? mc.cumulative_cost : 0) : 0;
  const sell = (v.selling_costs && v.selling_costs.total) || 0;
  return { years, dep, maint, sell, total: dep + maint + sell, resale: vc.private_sale_price };
}

function stackedBar(c) {
  const W = 620, H = 46, pad = 1;
  const seg = [["折舊", c.dep, "var(--dep)"], ["保養", c.maint, "var(--maint)"], ["賣出費用", c.sell, "var(--sell)"]];
  let x = 0, parts = "";
  for (const [name, val, fill] of seg) {
    const w = Math.max(0, (val / c.total) * W - pad);
    const pct = (val / c.total) * 100;
    parts += `<rect x="${x}" y="0" width="${w}" height="${H}" fill="${fill}" rx="3"><title>${name} NT$${nf(val)}（${pct.toFixed(1)}%）</title></rect>`;
    if (w > 74) parts += `<text x="${x + 10}" y="${H / 2 + 5}" fill="#fff" font-size="13" font-weight="500">${name} ${pct.toFixed(0)}%</text>`;
    x += w + pad;
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="成本組成">${parts}</svg></div>
  <div class="legend">
    <span><i style="background:var(--dep)"></i>折舊 NT$${nf(c.dep)}</span>
    <span><i style="background:var(--maint)"></i>保養 NT$${nf(c.maint)}</span>
    <span><i style="background:var(--sell)"></i>賣出費用 NT$${nf(c.sell)}</span>
  </div>`;
}

// Monthly cost by holding period — shows how the early depreciation hit spreads out.
function monthlyBars(v) {
  const pts = v.value_checkpoints.map(c => costAt(v, c.years)).filter(Boolean)
    .map(c => ({ years: c.years, monthly: c.total / (c.years * 12) }));
  if (!pts.length) return "";
  const W = 620, H = 200, L = 56, B = 30, T = 16;
  const max = Math.max(...pts.map(p => p.monthly)) * 1.12;
  const bw = (W - L - 12) / pts.length;
  let bars = "", grid = "";
  for (let i = 0; i <= 3; i++) {
    const val = (max / 3) * i, y = T + (H - T - B) * (1 - val / max);
    grid += `<line x1="${L}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
             <text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--ink-soft)">${nf(val / 1000)}k</text>`;
  }
  pts.forEach((p, i) => {
    const h = (H - T - B) * (p.monthly / max);
    const x = L + i * bw + bw * 0.22, y = H - B - h, w = bw * 0.56;
    bars += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--accent)" rx="3" opacity="${p.years === 10 ? 1 : 0.42}">
               <title>持有 ${p.years} 年：每月 NT$${nf(p.monthly)}</title></rect>
             <text x="${x + w / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${nf(p.monthly / 1000)}k</text>
             <text x="${x + w / 2}" y="${H - 10}" text-anchor="middle" font-size="12" fill="var(--ink-soft)">${p.years}年</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="每月平均成本">${grid}${bars}</svg></div>`;
}

function card(v, annualKm) {
  const c = costAt(v, 10);
  const name = [v.brand, v.model, v.trim].filter(Boolean).join(" ");
  const box = el("div", "card");
  if (!c) {
    box.innerHTML = `<h2>${name}</h2><p class="empty">缺少 10 年的 value_checkpoint，無法試算。</p>`;
    return box;
  }
  const km = annualKm * 10;
  const monthly = c.total / 120;
  box.innerHTML = `
    <h2>${name} <span class="badge">${v.model_year}</span> <span class="badge">${v.powertrain}</span></h2>
    <p class="meta">實付 NT$${nf(v.purchase.real_cost)} ・ 持有 10 年 ・ 累積 ${nf(km)} km ・ 10 年後估價 NT$${nf(c.resale)}</p>
    <div class="figs">
      <div class="fig"><div class="k">10 年總成本</div><div class="v">${nf(c.total)}<span class="u"> 元</span></div></div>
      <div class="fig"><div class="k">每月平均</div><div class="v">${nf(monthly)}<span class="u"> 元</span></div></div>
      <div class="fig"><div class="k">每年平均</div><div class="v small">${nf(c.total / 10)}<span class="u"> 元</span></div></div>
      <div class="fig"><div class="k">每公里成本</div><div class="v small">${(c.total / km).toFixed(1)}<span class="u"> 元/km</span></div></div>
    </div>
    <div class="split">
      <div><p class="sec">10 年成本組成</p>${stackedBar(c)}</div>
      <div><p class="sec">每月平均成本 × 持有年限</p>${monthlyBars(v)}</div>
    </div>
    <p class="note">折舊佔 ${((c.dep / c.total) * 100).toFixed(0)}%，是成本主體 —— 保養只佔 ${((c.maint / c.total) * 100).toFixed(0)}%。
      持有愈久，早期的折舊愈能被攤平：第 1 年每月 NT$${nf(costAt(v, 1).total / 12)}，到第 10 年降到 NT$${nf(monthly)}。</p>`;
  return box;
}

let DATA = [];
function render() {
  const annualKm = +document.getElementById("km").value;
  const out = document.getElementById("out");
  out.innerHTML = "";
  if (!DATA.length) { out.append(el("div", "card", '<p class="empty">沒有資料。請把車款填進 data/vehicles.json。</p>')); return; }
  DATA.forEach(v => out.append(card(v, annualKm)));
}

load().then(({ data, from }) => {
  DATA = data;
  document.getElementById("src").textContent = "資料來源：" + from;
  document.getElementById("km").addEventListener("change", render);
  render();
});
</script>
</body>
</html>
